name: Feature request
description: Propose a new capability
type: Feature

body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-line description of the feature
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / intent
      description: Why is this needed? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this be implemented? (optional)
      placeholder: Describe the approach, architecture, or user experience
    validations:
      required: false

  - type: textarea
    id: interface
    attributes:
      label: Interface
      description: >-
        Enough for a developer to open files and start. Kinds (library class,
        set of functions, executable, CLI command, CI job ...); location
        (repository path, namespace, main header and source); public interface
        as a C++ header draft (classes, public signatures, types); error
        reporting (Result/error code or exception, and when); construction and
        configuration (dependencies through the constructor or a factory, no
        global state, paths and addresses passed in by the caller, nothing
        hard-coded); lifecycle and threads (create/start/stop order, which calls
        may run concurrently and what the library serializes); callers, and
        the interfaces of other issues it uses (issue number and exact name).
      placeholder: |
        Kinds: library class `...`
        Location: `include/phm/sensor_io/....hpp`, `src/....cpp`, namespace `phm::sensor_io`

        ```cpp
        class Example {
         public:
          [[nodiscard]] Result<Value, Error> run(std::string_view name);
        };
        ```

        Errors: ...
        Construction and configuration: ...
        Lifecycle and threads: ...
        Callers and other issues: ...
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: Examples and test data
      description: >-
        Example inputs and expected outputs inline (hex frames, JSON, a
        result). Fixture files to add under tests/fixtures/<name>: short ones
        inline, long ones with how to generate them; the acceptance criteria
        name the fixture each test uses. At least one normal, one boundary and
        one error case, each as "input → expected result". All values invented:
        no real device, address, register map or data sample.
      placeholder: |
        Normal: <input> → <expected result>
        Boundary: <input> → <expected result>
        Error: <input> → <expected result>

        Fixture `tests/fixtures/<name>/<file>`:
        ...
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know this is complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Impact and urgency
      options:
        - "p0 — Critical, drop everything"
        - "p1 — Blocking the current milestone"
        - "p2 — Important, scheduled"
        - "p3 — Nice to have / polish"
    validations:
      required: true

  - type: checkboxes
    id: area
    attributes:
      label: Area
      description: Primary domain (select all that apply)
      options:
        - label: "area:driver — Bus drivers and device protocol implementations"
        - label: "area:docs — Documentation and guides"
        - label: "area:ci — CI workflows and automation"
